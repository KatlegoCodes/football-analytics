services:
  postgres:
    image: postgres:17
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - football-postgres-data:/var/lib/postgresql/data

volumes:
  football-postgres-data: